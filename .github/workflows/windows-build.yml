name: Compilation Windows - Darouich Travaux

on:
  workflow_dispatch:
  push:
    branches:
      - amelioration-interface-clients-2026
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Tester et compiler Windows x64
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installer MAUI Windows
        shell: pwsh
        run: dotnet workload install maui-windows

      - name: Restaurer les dépendances
        shell: pwsh
        run: dotnet restore DarouichTravaux.slnx

      - name: Tester les règles du logiciel
        shell: pwsh
        run: dotnet test tests/DarouichTravaux.Tests/DarouichTravaux.Tests.csproj -c Release --no-restore

      - name: Publier l'application Windows x64
        shell: pwsh
        run: |
          dotnet publish src/DarouichTravaux.Maui/DarouichTravaux.Maui.csproj `
            -f net10.0-windows10.0.19041.0 `
            -c Release -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -o artifacts/publish

      - name: Vérifier l'exécutable
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/publish/DarouichTravaux.exe")) {
            throw "Exécutable DarouichTravaux.exe non créé."
          }

      - name: Préparer le ZIP portable
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "DarouichTravaux-Windows-x64.zip" -Force

      - name: Mettre à disposition le ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DarouichTravaux-Windows-x64
          path: DarouichTravaux-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
