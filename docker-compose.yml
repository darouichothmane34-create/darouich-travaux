services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: darouich
      POSTGRES_USER: darouich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U darouich"], interval: 10s, timeout: 5s, retries: 5 }
  web:
    build: .
    environment:
      ConnectionStrings__PostgreSQL: Host=db;Database=darouich;Username=darouich;Password=${POSTGRES_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
    depends_on: { db: { condition: service_healthy } }
volumes: { postgres-data: {} }
